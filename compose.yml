services:
  postgres:
    image: postgres:16
    container_name: dainynas-postgres
    environment:
      POSTGRES_DB: dainynas
      POSTGRES_USER: dainynas
      POSTGRES_PASSWORD: dainynas
    ports:
      - "5432:5432"
    volumes:
      - dainynas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dainynas -d dainynas"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dainynas-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=dainynas;Username=dainynas;Password=dainynas
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dainynas-postgres-data: