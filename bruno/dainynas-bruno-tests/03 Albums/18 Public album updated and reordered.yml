info:
  name: Public album updated and reordered
  type: http
  seq: 18
http:
  method: GET
  url: '{{baseUrl}}/api/albums/{{albumAId}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("New title and order after moderation", () => {
         expect(res.body.title).to.equal(bru.getVar("runTag") + " Album FINAL");
         expect(res.body.songs.map(x => x.id)).to.deep.equal([Number(bru.getVar("songAId")), Number(bru.getVar("songBId"))]);
         expect(res.body.songs.map(x => x.position)).to.deep.equal([1,2]);
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
