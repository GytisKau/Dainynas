info:
  name: Guest reads public album
  type: http
  seq: 13
http:
  method: GET
  url: '{{baseUrl}}/api/albums/{{albumAId}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("Published album and order", () => {
         expect(res.body.publicationStatus).to.equal("Published");
         expect(res.body.title).to.equal(bru.getVar("runTag") + " Album DRAFT");
         expect(res.body.songs.map(x => x.id)).to.deep.equal([Number(bru.getVar("songBId")), Number(bru.getVar("songAId"))]);
         expect(res.body.links.self.href).to.equal("/api/albums/" + bru.getVar("albumAId"));
         res.body.songs.forEach(x => expect(x.links.song.href).to.equal("/api/songs/" + x.id));
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
