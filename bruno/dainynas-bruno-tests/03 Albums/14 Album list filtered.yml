info:
  name: Album list filtered
  type: http
  seq: 14
http:
  method: GET
  url: '{{baseUrl}}/api/albums?title={{runTag}}&page=1&pageSize=5'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("List filter and page", () => {
         expect(res.body.pageSize).to.equal(5);
         expect(res.body.items.some(x => x.id === Number(bru.getVar("albumAId")))).to.equal(true);
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
