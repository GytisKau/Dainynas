info:
  name: Create draft album
  type: http
  seq: 4
http:
  method: POST
  url: '{{baseUrl}}/api/albums'
  auth:
    type: bearer
    token: '{{userAToken}}'
  body:
    type: json
    data: |-
      {"title":"{{runTag}} Album","description":"Dainynas testų albumas","songIds":[{{songAId}},{{songBId}}]}
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 201 && res.body?.id != null) bru.setVar("albumAId", res.body.id);
  - type: tests
    code: |-
      test("HTTP 201", function () { expect(res.status).to.equal(201); });
       test("Album draft and song links", () => {
         expect(res.body.publicationStatus).to.equal("Draft");
         expect(res.body.songs).to.have.length(2);
         expect(res.body.songs.map(x => x.id)).to.deep.equal([Number(bru.getVar("songAId")), Number(bru.getVar("songBId"))]);
         expect(res.body.links.submit.method).to.equal("POST");
         res.body.songs.forEach(x => expect(x.links.song.href).to.equal("/api/songs/" + x.id));
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
