info:
  name: Moderator approves album
  type: http
  seq: 12
http:
  method: POST
  url: '{{baseUrl}}/api/moderation/requests/{{albumPublishRequestId}}/approve'
  auth:
    type: bearer
    token: '{{moderatorToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 204", function () { expect(res.status).to.equal(204); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
