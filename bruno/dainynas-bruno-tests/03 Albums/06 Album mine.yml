info:
  name: Album mine
  type: http
  seq: 6
http:
  method: GET
  url: '{{baseUrl}}/api/albums/mine?page=1&pageSize=10'
  auth:
    type: bearer
    token: '{{userAToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("Mine contains draft album", () => {
         expect(res.body.items.some(x => x.id === Number(bru.getVar("albumAId")))).to.equal(true);
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
