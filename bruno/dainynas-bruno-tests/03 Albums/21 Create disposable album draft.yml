info:
  name: Create disposable album draft
  type: http
  seq: 21
http:
  method: POST
  url: '{{baseUrl}}/api/albums'
  auth:
    type: bearer
    token: '{{userAToken}}'
  body:
    type: json
    data: |-
      {"title":"{{runTag}} Disposable Album","description":"Juodraštis ištrynimui","songIds":[{{songAId}}]}
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 201 && res.body?.id != null) bru.setVar("temporaryAlbumId", res.body.id);
  - type: tests
    code: |-
      test("HTTP 201", function () { expect(res.status).to.equal(201); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
