info:
  name: Owner sees draft order
  type: http
  seq: 9
http:
  method: GET
  url: '{{baseUrl}}/api/albums/{{albumAId}}'
  auth:
    type: bearer
    token: '{{userAToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("Album ordering preserved", () => {
         expect(res.body.songs.map(x => x.id)).to.deep.equal([Number(bru.getVar("songBId")), Number(bru.getVar("songAId"))]);
         expect(res.body.songs.map(x => x.position)).to.deep.equal([1,2]);
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
