info:
  name: Guest sees edited comment
  type: http
  seq: 10
http:
  method: GET
  url: '{{baseUrl}}/api/comments/{{commentAId}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
      test("No moderator needed", () => expect(res.body.text).to.contain("atnaujintas komentaras"));
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
