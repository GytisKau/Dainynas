info:
  name: Get comment by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/Comments/{{commentId}}"
  headers:
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: tests
      code: |-
        test("grąžina 200", function () { expect(res.status).to.equal(200); });
        test("ID sutampa", function () {
          expect(String(res.body.id)).to.equal(String(bru.getVar("commentId")));
        });
        test("turi comment hypermedia nuorodas", function () {
          expect(res.body).to.have.property("links");
          expect(res.body.links.self.href).to.equal(`/api/comments/${bru.getVar("commentId")}`);
          expect(res.body.links.self.method).to.equal("GET");
          expect(res.body.links.song.href).to.equal(`/api/songs/${bru.getVar("songId")}`);
          expect(res.body.links.update.method).to.equal("PUT");
          expect(res.body.links.delete.method).to.equal("DELETE");
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
