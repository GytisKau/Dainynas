info:
  name: User A edits own comment
  type: http
  seq: 9
http:
  method: PUT
  url: '{{baseUrl}}/api/comments/{{commentAId}}'
  auth:
    type: bearer
    token: '{{userAToken}}'
  body:
    type: json
    data: |-
      {"text":"{{runTag}} atnaujintas komentaras.","authorName":"BrunoTester","songId":{{songAId}}}
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 204", function () { expect(res.status).to.equal(204); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
