info:
  name: Get performer song comments
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/Performers/{{performerId}}/songs/{{songId}}/comments"
  headers:
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: tests
      code: |-
        test("grąžina 200", function () { expect(res.status).to.equal(200); });
        test("grąžina komentarų masyvą", function () { expect(res.body).to.be.an("array"); });
        test("yra sukurtas komentaras", function () {
          expect(res.body.some(x => String(x.id) === String(bru.getVar("commentId")))).to.equal(true);
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
