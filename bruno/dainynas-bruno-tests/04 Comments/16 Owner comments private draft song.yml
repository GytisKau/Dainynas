info:
  name: Owner comments private draft song
  type: http
  seq: 16
http:
  method: POST
  url: '{{baseUrl}}/api/comments'
  auth:
    type: bearer
    token: '{{userAToken}}'
  body:
    type: json
    data: |-
      {"text":"{{runTag}} private comment","authorName":"BrunoPrivate","songId":{{privateSongId}}}
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 201 && res.body?.id != null) bru.setVar("privateCommentId", res.body.id);
  - type: tests
    code: |-
      test("HTTP 201", function () { expect(res.status).to.equal(201); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
