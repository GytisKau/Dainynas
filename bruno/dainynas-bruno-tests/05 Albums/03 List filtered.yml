info:
  name: Filter albums
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/Albums?title=Bruno%20Test"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: title
      value: Bruno Test
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("grąžina 200", function () { expect(res.status).to.equal(200); });
        test("grąžina masyvą", function () { expect(res.body).to.be.an("array"); });
        test("filtras randa sukurtą albumą", function () {
          expect(res.body.some(x => String(x.id) === String(bru.getVar("albumId")))).to.equal(true);
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
