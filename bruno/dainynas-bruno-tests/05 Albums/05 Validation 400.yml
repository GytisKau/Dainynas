info:
  name: Reject album title over 200 chars
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/Albums"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",
        "description": "invalid",
        "isPublic": false,
        "songIds": []
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: test("pavadinimas > 200 simbolių grąžina 400", function () { expect(res.status).to.equal(400); });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
