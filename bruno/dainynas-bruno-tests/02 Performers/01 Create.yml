info:
  name: Create performer
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/Performers"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Bruno Test Performer",
        "birthYear": 1950,
        "residence": "Vilnius",
        "photoUrl": "https://example.com/performer.jpg"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body?.id != null) {
          bru.setVar("performerId", res.body.id);
        }
    - type: tests
      code: |-
        test("sukūrimas grąžina 201", function () { expect(res.status).to.equal(201); });
        test("atlikėjas turi ID ir pateiktus laukus", function () {
          expect(res.body.id).to.exist;
          expect(res.body.name).to.equal("Bruno Test Performer");
          expect(res.body.birthYear).to.equal(1950);
          expect(res.body.residence).to.equal("Vilnius");
        });

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
