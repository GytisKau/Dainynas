info:
  name: Get profile
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/performers/{{performerId}}/profile"

runtime:
  scripts:
    - type: tests
      code: |-
        test("statusas yra 200", function () {
          expect(res.status).to.equal(200);
        });

        test("profilis sudarytas iš performer ir songs duomenų", function () {
          expect(res.body.id).to.equal(Number(bru.getVar("performerId")));
          expect(res.body).to.have.property("name");
          expect(res.body).to.have.property("songCount");
          expect(res.body.songs).to.be.an("array");
        });

        test("songCount atitinka songs kiekį", function () {
          expect(res.body.songCount).to.equal(res.body.songs.length);
        });

        test("profilis turi hypermedia", function () {
          expect(res.body.links.self.href)
            .to.equal(
              `/api/performers/${bru.getVar("performerId")}/profile`
            );

          expect(res.body.links.performer.href)
            .to.equal(
              `/api/performers/${bru.getVar("performerId")}`
            );
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
