
info:
  name: Moderator current user
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/Auth/me"
  auth:
    type: bearer
    token: "{{moderatorToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Moderator /me -> 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Moderator tapatybė ir rolė", function () {
          expect(res.body.role).to.equal("Moderator");
          expect(res.body.id).to.exist;
          expect(res.body.email).to.equal(bru.getVar("moderatorEmail"));
        });
