info:
  name: Login with Admin
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/Auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.token) {
          bru.setVar("adminToken", res.body.token);
        }
    - type: tests
      code: |-
        test("prisijungimas grąžina 200", function () {
          expect(res.status).to.equal(200);
        });
        test("tokenas atnaujinamas runtime kintamajame", function () {
          expect(res.body.token).to.be.a("string").and.not.empty;
          expect(bru.getVar("adminToken")).to.equal(res.body.token);
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
