info:
  name: Old access token rejected
  type: http
  seq: 4
http:
  method: GET
  url: '{{baseUrl}}/api/auth/me'
  auth:
    type: bearer
    token: '{{oldFlowAccess}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 401", function () { expect(res.status).to.equal(401); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
