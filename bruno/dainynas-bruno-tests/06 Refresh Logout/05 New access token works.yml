info:
  name: New access token works
  type: http
  seq: 5
http:
  method: GET
  url: '{{baseUrl}}/api/auth/me'
  auth:
    type: bearer
    token: '{{flowAccess}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
      test("Current session valid", () => expect(res.body.role).to.equal("User"));
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
