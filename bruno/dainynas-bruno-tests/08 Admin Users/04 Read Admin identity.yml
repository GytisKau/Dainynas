info:
  name: Read Admin identity
  type: http
  seq: 4
http:
  method: GET
  url: '{{baseUrl}}/api/auth/me'
  auth:
    type: bearer
    token: '{{adminToken}}'
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 200) bru.setVar("adminCurrentId", res.body.id);
  - type: tests
    code: |-
      test("HTTP 200", () => expect(res.status).to.equal(200));
      test("Admin ID recorded", () => expect(Number(res.body.id)).to.be.greaterThan(0));
      test("Admin role", () => expect(res.body.role).to.equal("Admin"));
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
