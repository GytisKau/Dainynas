info:
  name: Dedicated user identity
  type: http
  seq: 12
http:
  method: GET
  url: '{{baseUrl}}/api/auth/me'
  auth:
    type: bearer
    token: '{{adminSubjectToken}}'
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 200) bru.setVar("adminSubjectId", res.body.id);
  - type: tests
    code: |-
      test("HTTP 200", () => expect(res.status).to.equal(200));
      test("Dedicated user identity", () => { expect(res.body.email).to.equal(bru.getVar("adminSubjectEmail")); expect(res.body.role).to.equal("User"); expect(Number(res.body.id)).to.be.greaterThan(0); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
