info:
  name: Moderator cannot list users
  type: http
  seq: 7
http:
  method: GET
  url: '{{baseUrl}}/api/admin/users'
  auth:
    type: bearer
    token: '{{moderatorToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 403", () => expect(res.status).to.equal(403));
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
