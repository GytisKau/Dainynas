info:
  name: Moderator subject logs in again
  type: http
  seq: 23
http:
  method: POST
  url: '{{baseUrl}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{adminSubjectEmail}}",
        "password": "{{adminSubjectPassword}}"
      }
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 200) { bru.setVar("adminSubjectToken", res.body.token); bru.setVar("adminSubjectRefresh", res.body.refreshToken); }
  - type: tests
    code: |-
      test("HTTP 200", () => expect(res.status).to.equal(200));
      test("New role in issued token", () => expect(res.body.role).to.equal("Moderator"));
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
