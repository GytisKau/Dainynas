info:
  name: Admin reads user details
  type: http
  seq: 13
http:
  method: GET
  url: '{{baseUrl}}/api/admin/users/{{adminSubjectId}}'
  auth:
    type: bearer
    token: '{{adminToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => expect(res.status).to.equal(200));
      test("Correct user", () => { expect(Number(res.body.id)).to.equal(Number(bru.getVar("adminSubjectId"))); expect(res.body.email).to.equal(bru.getVar("adminSubjectEmail")); expect(res.body.role).to.equal("User"); expect(res.body.isBlocked).to.equal(false); });
      test("Secrets excluded", () => { expect(res.body).not.to.have.property("passwordHash"); expect(res.body).not.to.have.property("tokenHash"); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
