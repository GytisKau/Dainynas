info:
  name: Promote User to Moderator
  type: http
  seq: 19
http:
  method: PUT
  url: '{{baseUrl}}/api/admin/users/{{adminSubjectId}}/role'
  auth:
    type: bearer
    token: '{{adminToken}}'
  body:
    type: json
    data: |-
      {
        "role": "Moderator"
      }
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 204", () => expect(res.status).to.equal(204));
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
