info:
  name: Promoted Moderator can read moderation
  type: http
  seq: 24
http:
  method: GET
  url: '{{baseUrl}}/api/moderation/requests?page=1&pageSize=1'
  auth:
    type: bearer
    token: '{{adminSubjectToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => expect(res.status).to.equal(200));
      test("Moderation list visible", () => expect(res.body.items).to.be.an("array"));
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
