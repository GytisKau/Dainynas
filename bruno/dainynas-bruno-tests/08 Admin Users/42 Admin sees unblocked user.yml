info:
  name: Admin sees unblocked user
  type: http
  seq: 42
http:
  method: GET
  url: '{{baseUrl}}/api/admin/users/{{adminSubjectId}}'
  auth:
    type: bearer
    token: '{{adminToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => expect(res.status).to.equal(200));
      test("Account restored", () => { expect(res.body.isBlocked).to.equal(false); expect(res.body.activeSessions).to.be.greaterThan(0); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
