info:
  name: Fresh Admin login
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 200) bru.setVar("adminToken", res.body.token);
  - type: tests
    code: |-
      test("HTTP 200", () => expect(res.status).to.equal(200));
      test("Authenticated as Admin", () => expect(res.body.role).to.equal("Admin"));
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
