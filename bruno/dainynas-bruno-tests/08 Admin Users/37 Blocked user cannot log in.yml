http:
  method: POST
  url: '{{baseUrl}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{adminSubjectEmail}}",
        "password": "{{adminSubjectPassword}}"
      }
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 401", () => expect(res.status).to.equal(401));
