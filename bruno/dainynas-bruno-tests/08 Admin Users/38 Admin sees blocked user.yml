info:
  name: Admin sees blocked user
  type: http
  seq: 38
http:
  method: GET
  url: '{{baseUrl}}/api/admin/users/{{adminSubjectId}}'
  auth:
    type: bearer
    token: '{{adminToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => expect(res.status).to.equal(200));
      test("Blocked and sessions revoked", () => { expect(res.body.role).to.equal("User"); expect(res.body.isBlocked).to.equal(true); expect(res.body.activeSessions).to.equal(0); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
