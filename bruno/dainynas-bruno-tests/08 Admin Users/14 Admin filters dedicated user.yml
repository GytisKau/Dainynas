info:
  name: Admin filters dedicated user
  type: http
  seq: 14
http:
  method: GET
  url: '{{baseUrl}}/api/admin/users?email={{adminSubjectEmail}}&role=User&isBlocked=false&page=1&pageSize=10'
  auth:
    type: bearer
    token: '{{adminToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => expect(res.status).to.equal(200));
      test("Filter results", () => { expect(res.body.items).to.be.an("array"); expect(res.body.items.some(x => x.email === bru.getVar("adminSubjectEmail") && x.role === "User" && x.isBlocked === false)).to.equal(true); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
