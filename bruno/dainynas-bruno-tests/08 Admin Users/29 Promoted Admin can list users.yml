info:
  name: Promoted Admin can list users
  type: http
  seq: 29
http:
  method: GET
  url: '{{baseUrl}}/api/admin/users?page=1&pageSize=5'
  auth:
    type: bearer
    token: '{{adminSubjectToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => expect(res.status).to.equal(200));
      test("Admin list visible", () => expect(res.body.items).to.be.an("array"));
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
