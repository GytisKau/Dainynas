info:
  name: Admin lists users
  type: http
  seq: 8
http:
  method: GET
  url: '{{baseUrl}}/api/admin/users?page=1&pageSize=10'
  auth:
    type: bearer
    token: '{{adminToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => expect(res.status).to.equal(200));
      test("Paged users", () => { expect(res.body.items).to.be.an("array"); expect(res.body.page).to.equal(1); expect(res.body.pageSize).to.equal(10); });
      test("No secrets returned", () => { for (const x of res.body.items) { expect(x).to.have.property("id"); expect(x).to.have.property("email"); expect(x).to.have.property("role"); expect(x).to.have.property("isBlocked"); expect(x).to.have.property("activeSessions"); expect(x).not.to.have.property("passwordHash"); expect(x).not.to.have.property("tokenHash"); expect(x).not.to.have.property("refreshToken"); } });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
