info:
  name: Get song by ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/Songs/{{songId}}"
  headers:
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: tests
      code: |-
        test("grąžina 200", function () { expect(res.status).to.equal(200); });
        test("ID sutampa", function () {
          expect(String(res.body.id)).to.equal(String(bru.getVar("songId")));
        });
        test("yra pagrindiniai SongDto laukai", function () {
          expect(res.body).to.have.property("title");
          expect(res.body).to.have.property("isPublic");
          expect(res.body).to.have.property("performerId");
          expect(res.body).to.have.property("performerName");
        });
        test("turi song hypermedia nuorodas", function () {
          expect(res.body).to.have.property("links");
          expect(res.body.links.self.href).to.equal(`/api/songs/${bru.getVar("songId")}`);
          expect(res.body.links.self.method).to.equal("GET");
          expect(res.body.links.performer.href).to.equal(`/api/performers/${bru.getVar("performerId")}`);
          expect(res.body.links.comments.href).to.equal(`/api/performers/${bru.getVar("performerId")}/songs/${bru.getVar("songId")}/comments`);
          expect(res.body.links.update.method).to.equal("PUT");
          expect(res.body.links.delete.method).to.equal("DELETE");
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
