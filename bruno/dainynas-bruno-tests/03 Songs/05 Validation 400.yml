      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Invalid song",
        "lyrics": null,
        "recordingYear": 1799,
        "recordingPlace": null,
        "externalArchiveUrl": null,
        "audioUrl": null,
        "isPublic": false,
        "performerId": "{{performerId}}"
