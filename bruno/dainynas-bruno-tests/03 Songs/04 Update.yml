info:
  name: Update song
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/Songs/{{songId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Bruno Test Song Updated",
        "lyrics": "Atnaujinti žodžiai",
        "recordingYear": 1981,
        "recordingPlace": "Kaunas",
        "externalArchiveUrl": "https://example.com/archive/song-updated",
        "audioUrl": "https://example.com/audio/song-updated.mp3",
        "isPublic": true,
        "performerId": "{{performerId}}"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("statusas yra 204", function () {
          expect(res.status).to.equal(204);
        });
        test("atsakymas nėra serverio klaida", function () {
          expect(res.status).to.be.below(500);
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
