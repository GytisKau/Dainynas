info:
  name: Submit published performer changes for rejection
  type: http
  seq: 20
http:
  method: PUT
  url: '{{baseUrl}}/api/performers/{{performerAId}}'
  auth:
    type: bearer
    token: '{{userAToken}}'
  body:
    type: json
    data: |-
      {"name":"{{runTag}} REJECTED","birthYear":1902,"residence":"Šiauliai","photoUrl":null}
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 202 && res.body?.requestId != null) bru.setVar("performerRejectRequestId", res.body.requestId);
  - type: tests
    code: |-
      test("HTTP 202", function () { expect(res.status).to.equal(202); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
