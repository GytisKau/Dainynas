info:
  name: Create temporary performer draft
  type: http
  seq: 31
http:
  method: POST
  url: '{{baseUrl}}/api/performers'
  auth:
    type: bearer
    token: '{{userAToken}}'
  body:
    type: json
    data: |-
      {"name":"{{runTag}} Temporary Performer","birthYear":1950,"residence":"Alytus","photoUrl":null}
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 201 && res.body?.id != null) bru.setVar("temporaryPerformerId", res.body.id);
  - type: tests
    code: |-
      test("HTTP 201", function () { expect(res.status).to.equal(201); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
