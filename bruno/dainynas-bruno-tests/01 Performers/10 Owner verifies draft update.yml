info:
  name: Owner verifies draft update
  type: http
  seq: 10
http:
  method: GET
  url: '{{baseUrl}}/api/performers/{{performerAId}}'
  auth:
    type: bearer
    token: '{{userAToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
      test("Updated draft", () => expect(res.body.name).to.equal(bru.getVar("runTag") + " Performer A DRAFT"));
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
