info:
  name: User B submits performer
  type: http
  seq: 29
http:
  method: POST
  url: '{{baseUrl}}/api/performers/{{performerBId}}/submit'
  auth:
    type: bearer
    token: '{{userBToken}}'
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 202 && res.body?.requestId != null) bru.setVar("performerBRequestId", res.body.requestId);
  - type: tests
    code: |-
      test("HTTP 202", function () { expect(res.status).to.equal(202); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
