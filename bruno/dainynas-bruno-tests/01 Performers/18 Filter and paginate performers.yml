info:
  name: Filter and paginate performers
  type: http
  seq: 18
http:
  method: GET
  url: '{{baseUrl}}/api/performers?name={{runTag}}&page=1&pageSize=10'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("Filtered list contains performer", () => {
         expect(res.body.page).to.equal(1);
         expect(res.body.pageSize).to.equal(10);
         expect(res.body.items.some(x => x.id === Number(bru.getVar("performerAId")))).to.equal(true);
         expect(res.body.totalItems).to.be.at.least(1);
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
