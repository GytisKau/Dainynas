info:
  name: Public performer visible
  type: http
  seq: 17
http:
  method: GET
  url: '{{baseUrl}}/api/performers/{{performerAId}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("Published is public", () => {
         expect(res.body.publicationStatus).to.equal("Published");
         expect(res.body.name).to.equal(bru.getVar("runTag") + " Performer A DRAFT");
         expect(res.body.links.self.href).to.equal("/api/performers/" + bru.getVar("performerAId"));
         expect(res.body.links).not.to.have.property("update");
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
