info:
  name: User B creates performer
  type: http
  seq: 28
http:
  method: POST
  url: '{{baseUrl}}/api/performers'
  auth:
    type: bearer
    token: '{{userBToken}}'
  body:
    type: json
    data: |-
      {"name":"{{runTag}} Performer B","birthYear":1912,"residence":"Dzūkija","photoUrl":null}
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 201 && res.body?.id != null) bru.setVar("performerBId", res.body.id);
  - type: tests
    code: |-
      test("HTTP 201", function () { expect(res.status).to.equal(201); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
