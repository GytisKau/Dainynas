info:
  name: Double approval forbidden
  type: http
  seq: 16
http:
  method: POST
  url: '{{baseUrl}}/api/moderation/requests/{{performerPublishRequestId}}/approve'
  auth:
    type: bearer
    token: '{{moderatorToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 409", function () { expect(res.status).to.equal(409); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
