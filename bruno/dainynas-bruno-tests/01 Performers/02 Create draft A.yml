info:
  name: Create draft A
  type: http
  seq: 2
http:
  method: POST
  url: '{{baseUrl}}/api/performers'
  auth:
    type: bearer
    token: '{{userAToken}}'
  body:
    type: json
    data: |-
      {"name":"{{runTag}} Performer A","birthYear":1900,"residence":"Kaišiadorys","photoUrl":null}
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 201 && res.body?.id != null) bru.setVar("performerAId", res.body.id);
  - type: tests
    code: |-
      test("HTTP 201", function () { expect(res.status).to.equal(201); });
       test("Draft and hypermedia", () => {
         expect(res.body.publicationStatus).to.equal("Draft");
         expect(res.body.links.self.href).to.equal("/api/performers/" + res.body.id);
         expect(res.body.links.submit.method).to.equal("POST");
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
