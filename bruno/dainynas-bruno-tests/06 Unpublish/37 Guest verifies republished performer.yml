info:
  name: Guest verifies republished performer
  type: http
  seq: 37
http:
  method: GET
  url: '{{baseUrl}}/api/performers/{{performerAId}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
      test("Republished performer name", () => { expect(res.body.publicationStatus).to.equal("Published"); expect(res.body.name).to.equal(bru.getVar("runTag") + " Performer PRIVATE EDIT"); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
