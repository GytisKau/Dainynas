info:
  name: Create album update awaiting moderation
  type: http
  seq: 5
http:
  method: PUT
  url: '{{baseUrl}}/api/albums/{{albumAId}}'
  auth:
    type: bearer
    token: '{{userAToken}}'
  body:
    type: json
    data: |-
      {"title":"{{runTag}} Pending Unpublish Block","description":"pending update","songIds":[{{songAId}},{{songBId}}]}
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 202 && res.body?.requestId != null) bru.setVar("albumPendingBlockRequestId", res.body.requestId);
  - type: tests
    code: |-
      test("HTTP 202", function () { expect(res.status).to.equal(202); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
