info:
  name: Moderator rejects pending album update
  type: http
  seq: 7
http:
  method: POST
  url: '{{baseUrl}}/api/moderation/requests/{{albumPendingBlockRequestId}}/reject'
  auth:
    type: bearer
    token: '{{moderatorToken}}'
  body:
    type: json
    data: |-
      {"reason":"Test: release pending change before unpublish"}
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 204", function () { expect(res.status).to.equal(204); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
