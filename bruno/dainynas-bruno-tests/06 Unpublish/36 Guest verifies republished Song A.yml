info:
  name: Guest verifies republished Song A
  type: http
  seq: 36
http:
  method: GET
  url: '{{baseUrl}}/api/songs/{{songAId}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
      test("Republished song title", () => { expect(res.body.publicationStatus).to.equal("Published"); expect(res.body.title).to.equal(bru.getVar("runTag") + " Song A PRIVATE EDIT"); expect(res.body.isPublic).to.equal(undefined); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
