info:
  name: Owner sees Song A draft
  type: http
  seq: 17
http:
  method: GET
  url: '{{baseUrl}}/api/songs/{{songAId}}'
  auth:
    type: bearer
    token: '{{userAToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
      test("Draft and submit link", () => { expect(res.body.publicationStatus).to.equal("Draft"); expect(res.body.links.submit.method).to.equal("POST"); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
