info:
  name: Owner verifies unpublished performer edit
  type: http
  seq: 26
http:
  method: GET
  url: '{{baseUrl}}/api/performers/{{performerAId}}'
  auth:
    type: bearer
    token: '{{userAToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
      test("Performer draft edited", () => { expect(res.body.publicationStatus).to.equal("Draft"); expect(res.body.name).to.equal(bru.getVar("runTag") + " Performer PRIVATE EDIT"); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
