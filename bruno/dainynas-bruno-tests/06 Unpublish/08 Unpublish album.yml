info:
  name: Unpublish album
  type: http
  seq: 8
http:
  method: POST
  url: '{{baseUrl}}/api/albums/{{albumAId}}/unpublish'
  auth:
    type: bearer
    token: '{{userAToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 204", function () { expect(res.status).to.equal(204); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
