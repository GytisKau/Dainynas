info:
  name: Random refresh token rejected
  type: http
  seq: 9
http:
  method: POST
  url: '{{baseUrl}}/api/auth/refresh'
  body:
    type: json
    data: |-
      {"refreshToken":"invalid-refresh-token"}
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 401", function () { expect(res.status).to.equal(401); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
