info:
  name: OpenAPI document
  type: http
  seq: 15
http:
  method: GET
  url: '{{baseUrl}}/openapi/v1.json'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
      test("OpenAPI paths are present", () => { expect(res.body).to.have.property("paths"); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
