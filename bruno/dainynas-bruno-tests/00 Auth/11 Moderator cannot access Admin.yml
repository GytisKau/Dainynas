info:
  name: Moderator cannot access Admin
  type: http
  seq: 11
http:
  method: GET
  url: '{{baseUrl}}/api/auth/admin'
  auth:
    type: bearer
    token: '{{moderatorToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 403", function () { expect(res.status).to.equal(403); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
