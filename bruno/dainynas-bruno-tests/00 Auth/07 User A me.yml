http:
  method: GET
  url: '{{baseUrl}}/api/auth/me'
  auth:
    type: bearer
    token: '{{userAToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("Authenticated ID email and role", function () {
         expect(res.body.role).to.equal("User");
         expect(res.body.email).to.equal(bru.getVar("userAEmail"));
         expect(Number(res.body.id)).to.be.greaterThan(0);
       });
