info:
  name: Verify comment is deleted
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/Comments/{{commentId}}"
  headers:
    - name: Accept
      value: application/json

runtime:
  scripts:
    - type: tests
      code: |-
        test("statusas yra 404", function () {
          expect(res.status).to.equal(404);
        });
        test("atsakymas nėra serverio klaida", function () {
          expect(res.status).to.be.below(500);
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
