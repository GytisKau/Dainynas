info:
  name: Delete created performer
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{baseUrl}}/api/Performers/{{performerId}}"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("statusas yra 204", function () {
          expect(res.status).to.equal(204);
        });
        test("atsakymas nėra serverio klaida", function () {
          expect(res.status).to.be.below(500);
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
