info:
  name: Moderator moderation list
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/api/moderation/requests?status=Approved&page=1&pageSize=10'
  auth:
    type: bearer
    token: '{{moderatorToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("Paginated moderation queue", () => {
         expect(res.body.items).to.be.an("array");
         expect(res.body.page).to.equal(1);
         expect(res.body.pageSize).to.equal(10);
         expect(res.body.items.every(x => x.status === "Approved")).to.equal(true);
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
