info:
  name: Admin moderation list
  type: http
  seq: 4
http:
  method: GET
  url: '{{baseUrl}}/api/moderation/requests?page=1&pageSize=5'
  auth:
    type: bearer
    token: '{{adminToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
      test("Admin can review", () => expect(res.body.items).to.be.an("array"));
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
