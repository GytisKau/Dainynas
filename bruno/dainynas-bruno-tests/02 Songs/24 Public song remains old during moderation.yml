info:
  name: Public song remains old during moderation
  type: http
  seq: 24
http:
  method: GET
  url: '{{baseUrl}}/api/songs/{{songAId}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
      test("Pending update not leaked", () => expect(res.body.title).to.equal(bru.getVar("runTag") + " Song A DRAFT"));
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
