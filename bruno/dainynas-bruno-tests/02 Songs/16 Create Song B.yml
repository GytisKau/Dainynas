info:
  name: Create Song B
  type: http
  seq: 16
http:
  method: POST
  url: '{{baseUrl}}/api/songs'
  auth:
    type: bearer
    token: '{{userAToken}}'
  body:
    type: json
    data: |-
      {"title":"{{runTag}} Song B","lyrics":"Antroji testinė daina.","recordingYear":1970,"recordingPlace":"Vilnius","externalArchiveUrl":null,"audioUrl":null,"isPublic":true,"performerId":{{performerAId}}}
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 201 && res.body?.id != null) bru.setVar("songBId", res.body.id);
  - type: tests
    code: |-
      test("HTTP 201", function () { expect(res.status).to.equal(201); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
