info:
  name: Create dependency performer draft
  type: http
  seq: 2
http:
  method: POST
  url: '{{baseUrl}}/api/performers'
  auth:
    type: bearer
    token: '{{userAToken}}'
  body:
    type: json
    data: |-
      {"name":"{{runTag}} Unpublished Performer","birthYear":1950,"residence":"Vilnius","photoUrl":null}
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 201 && res.body?.id != null) bru.setVar("dependencyPerformerId", res.body.id);
  - type: tests
    code: |-
      test("HTTP 201", function () { expect(res.status).to.equal(201); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
