info:
  name: Published Song A update proposal
  type: http
  seq: 23
http:
  method: PUT
  url: '{{baseUrl}}/api/songs/{{songAId}}'
  auth:
    type: bearer
    token: '{{userAToken}}'
  body:
    type: json
    data: |-
      {"title":"{{runTag}} Song A FINAL","lyrics":"Galutinis patvirtintas tekstas.","recordingYear":1965,"recordingPlace":"Kaišiadorys","externalArchiveUrl":null,"audioUrl":null,"performerId":{{performerAId}}}
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 202 && res.body?.requestId != null) bru.setVar("songAUpdateRequestId", res.body.requestId);
  - type: tests
    code: |-
      test("HTTP 202", function () { expect(res.status).to.equal(202); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
