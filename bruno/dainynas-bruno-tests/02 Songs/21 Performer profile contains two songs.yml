info:
  name: Performer profile contains two songs
  type: http
  seq: 21
http:
  method: GET
  url: '{{baseUrl}}/api/performers/{{performerAId}}/profile'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("Composite performer plus songs resource", () => {
         expect(res.body.songCount).to.equal(2);
         expect(res.body.songs).to.have.length(2);
         expect(res.body.songs.some(x => x.id === Number(bru.getVar("songAId")))).to.equal(true);
         res.body.songs.forEach(x => expect(x.links.self.href).to.equal("/api/songs/" + x.id));
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
