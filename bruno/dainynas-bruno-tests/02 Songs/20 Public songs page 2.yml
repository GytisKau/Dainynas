info:
  name: Public songs page 2
  type: http
  seq: 20
http:
  method: GET
  url: '{{baseUrl}}/api/songs?title={{runTag}}&performerId={{performerAId}}&page=2&pageSize=1'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("Second page is stable", () => {
         expect(res.body.page).to.equal(2);
         expect(res.body.pageSize).to.equal(1);
         expect(res.body.items).to.have.length(1);
         expect(res.body.totalItems).to.equal(2);
         expect(res.body.items[0].id).to.equal(Number(bru.getVar("songBId")));
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
