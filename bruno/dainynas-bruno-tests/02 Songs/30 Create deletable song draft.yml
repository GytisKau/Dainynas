info:
  name: Create deletable song draft
  type: http
  seq: 30
http:
  method: POST
  url: '{{baseUrl}}/api/songs'
  auth:
    type: bearer
    token: '{{userAToken}}'
  body:
    type: json
    data: |-
      {"title":"{{runTag}} Throwaway Song","lyrics":"","recordingYear":1965,"recordingPlace":"Vilnius","externalArchiveUrl":null,"audioUrl":null,"performerId":{{performerAId}}}
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.status === 201 && res.body?.id != null) bru.setVar("temporarySongId", res.body.id);
  - type: tests
    code: |-
      test("HTTP 201", function () { expect(res.status).to.equal(201); });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
