info:
  name: Guest reads Song A
  type: http
  seq: 15
http:
  method: GET
  url: '{{baseUrl}}/api/songs/{{songAId}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("Published song and hypermedia", () => {
         expect(res.body.publicationStatus).to.equal("Published");
         expect(res.body.title).to.equal(bru.getVar("runTag") + " Song A DRAFT");
         expect(res.body.links.self.href).to.equal("/api/songs/" + bru.getVar("songAId"));
         expect(res.body.links.performer.href).to.equal("/api/performers/" + bru.getVar("performerAId"));
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
