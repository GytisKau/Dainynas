info:
  name: Owner song mine
  type: http
  seq: 11
http:
  method: GET
  url: '{{baseUrl}}/api/songs/mine?page=1&pageSize=20'
  auth:
    type: bearer
    token: '{{userAToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("Mine includes draft", () => {
         expect(res.body.items).to.be.an("array");
         expect(res.body.items.some(x => x.id === Number(bru.getVar("songAId")))).to.equal(true);
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
