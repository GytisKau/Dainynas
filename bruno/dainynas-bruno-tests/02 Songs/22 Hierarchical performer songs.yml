info:
  name: Hierarchical performer songs
  type: http
  seq: 22
http:
  method: GET
  url: '{{baseUrl}}/api/performers/{{performerAId}}/songs?page=1&pageSize=10'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", function () { expect(res.status).to.equal(200); });
       test("Scoped song list", () => {
         expect(res.body.items.some(x => x.id === Number(bru.getVar("songAId")))).to.equal(true);
         expect(res.body.items.every(x => x.performerId === Number(bru.getVar("performerAId")))).to.equal(true);
       });
settings:
  encodeUrl: false
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
